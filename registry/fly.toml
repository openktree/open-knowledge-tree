# Fly.io config for the OKT Knowledge Registry (dev app: okt-registry-dev).
#
# Dev deployment: sqlite metadata + Cloudflare R2 object storage.
# R2 credentials are set as Fly secrets (not in this file) so they
# never land in version control.
#
# Secrets set via `flyctl secrets set -a okt-registry-dev`:
#   REGISTRY_STORAGE_BACKEND=s3
#   REGISTRY_S3_ENDPOINT=https://<account>.r2.cloudflarestorage.com
#   REGISTRY_S3_BUCKET=okt-registry-dev
#   REGISTRY_S3_ACCESS_KEY=... REGISTRY_S3_SECRET_KEY=...
#   REGISTRY_AUTH_JWT_SECRET=<random>
#   REGISTRY_AUTH_BOOTSTRAP_ADMINS=<comma-separated-emails>
# Email validation (account verify-before-login). Uses Resend as
# the SMTP relay; the password is the RESEND_API key:
#   REGISTRY_EMAIL_VALIDATION_ENABLE_VALIDATION=true
#   REGISTRY_EMAIL_VALIDATION_FROM_ADDRESS=no-reply@openktree.com
#   REGISTRY_EMAIL_VALIDATION_PUBLIC_BASE_URL=https://okt-registry-dev.fly.dev
#   REGISTRY_EMAIL_VALIDATION_SMTP_HOST=smtp.resend.com
#   REGISTRY_EMAIL_VALIDATION_SMTP_PORT=587
#   REGISTRY_EMAIL_VALIDATION_SMTP_USERNAME=resend
#   REGISTRY_EMAIL_VALIDATION_SMTP_PASSWORD=<RESEND_API key>
#   REGISTRY_EMAIL_VALIDATION_SMTP_TLS=true
app = 'okt-registry-dev'
primary_region = 'iad'

[build]
dockerfile = 'Dockerfile.registry'

[env]
REGISTRY_DATABASE_DRIVER = 'sqlite'
REGISTRY_DATABASE_URL = '/data/registry.db'
REGISTRY_AUTH_AUTH_MODE = 'open'
# Email validation (account verify-before-login). The SMTP
# password is the RESEND_API key, set as a Fly secret
# (REGISTRY_EMAIL_VALIDATION_SMTP_PASSWORD) — never in this file.
REGISTRY_EMAIL_VALIDATION_ENABLE_VALIDATION = 'true'
REGISTRY_EMAIL_VALIDATION_FROM_ADDRESS = 'no-reply@openktree.com'
REGISTRY_EMAIL_VALIDATION_PUBLIC_BASE_URL = 'https://okt-registry-dev.fly.dev'
REGISTRY_EMAIL_VALIDATION_SMTP_HOST = 'smtp.resend.com'
REGISTRY_EMAIL_VALIDATION_SMTP_PORT = '587'
REGISTRY_EMAIL_VALIDATION_SMTP_USERNAME = 'resend'
REGISTRY_EMAIL_VALIDATION_SMTP_TLS = 'true'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = false
auto_start_machines = false
min_machines_running = 1

[http_service.concurrency]
type = 'requests'
hard_limit = 250
soft_limit = 200

[[vm]]
size = 'shared-cpu-1x'
memory = '256mb'

[[mounts]]
source = 'registry_data'
destination = '/data'