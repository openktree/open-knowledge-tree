# Permissive golangci-lint config used by CI and `just lint`.
# Goal: gate new breakage without retroactively churning the codebase.
#
# This is the golangci-lint **v2** schema (migrated from v1 so the
# linter can analyze Go 1.25 code — golangci-lint v1.62 was built
# with go1.23 and refused to lint modules whose go.mod declares
# go 1.25). CI pins golangci/golangci-lint-action@v7 with version
# v2.12.2 to match. To downgrade back to v1, revert to the v1
# schema (run / backend / registry go.mod would also need to drop
# to go 1.23 or lower).
#
# Run separately per module:
#   cd backend && golangci-lint run ./...
#   cd registry && golangci-lint run ./...
version: "2"
linters:
  settings:
    staticcheck:
      checks:
        - all
        - -SA1029
        - -ST1000
        - -ST1003
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/openktree/open-knowledge-tree/backend
        - github.com/openktree/knowledge-registry
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
