# Builds and pushes the okt-api Docker image to GHCR on every
# `api-v*` tag push from release-please.
#
# The OKT API is self-hosted (users run it locally / on their own
# infra); there is no Fly-hosted API app. So this workflow only
# builds and publishes the image — it does NOT deploy anywhere.
# (The registry and frontend are the Fly-hosted services; see
# release-registry.yml / release-frontend.yml for those.)
#
# linux/amd64 only for now. Also tags `:latest`. The Dockerfile does
# the CGo compile (go-fitz / MuPDF) inside Alpine.
#
# Prod (self-hosted) deploys are manual: an operator pulls
# ghcr.io/openktree/api:<version> (or :latest) and runs it via
# docker-compose / their own orchestrator.
name: release-api

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. api-v1.0.0)'
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/openktree/api

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches service
        run: scripts/release/verify-tag.sh api
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag from release tag
        id: tag
        run: echo "version=${TAG#api-v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max