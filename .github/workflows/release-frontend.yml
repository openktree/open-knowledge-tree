# Builds and pushes the okt-frontend nginx Docker image to GHCR on
# every `frontend-v*` tag push from release-please.
#
# The OKT frontend is self-hosted (users run it locally / on their
# own infra alongside the API); there is no Fly-hosted frontend app.
# So this workflow only builds and publishes the image — it does NOT
# deploy anywhere. (The registry is the only Fly-hosted service; see
# release-registry.yml. Docs deploy to Cloudflare Pages via
# docs-cloudflare.yml.)
#
# linux/amd64 only for now. Also tags `:latest`. The Dockerfile builds
# the SolidJS app with Vite and serves the static bundle with nginx.
#
# Prod (self-hosted) deploys are manual: an operator pulls
# ghcr.io/openktree/frontend:<version> (or :latest) and runs it via
# docker-compose / their own orchestrator.
name: release-frontend

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. frontend-v1.0.0)'
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/openktree/frontend

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches service
        run: scripts/release/verify-tag.sh frontend
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag from release tag
        id: tag
        run: echo "version=${TAG#frontend-v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max