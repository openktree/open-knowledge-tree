# CI gate for pull requests and pushes to main.
#
# Mirrors the local gates documented in AGENTS.md ("CI & Lefthook"):
#   - golangci-lint on backend/ and registry/ (permissive .golangci.yml)
#   - frontend: Biome check + vite build + page-size policy
#   - backend: go build + go vet + unit tests (./internal/... ./cmd/...)
#   - backend e2e: full ./e2e/... against a tmpfs Postgres on :5433
#       (skips the SERPER_API_KEY-gated test; add the secret to enable it)
#   - registry: go build + go vet + go test
#   - sqlc: regenerate and diff against the checked-in internal/store/
#
# Path filtering (dorny/paths-filter) skips jobs whose files weren't
# touched, so a docs-only PR doesn't pay the backend-e2e bill.
#
# Local mirror:
#   just lefthook-install   # one-time, wires pre-commit + pre-push
#   just check-frontend    # page-size + vite build
#   just lint              # golangci-lint on both Go modules
#   just lint-frontend     # Biome check
#   just test-e2e          # the e2e suite CI runs (sans SERPER)
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      registry: ${{ steps.f.outputs.registry }}
      frontend: ${{ steps.f.outputs.frontend }}
      ai-plugins: ${{ steps.f.outputs.ai-plugins }}
      workflows: ${{ steps.f.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.golangci.yml'
            registry:
              - 'registry/**'
              - '.golangci.yml'
            frontend:
              - 'frontend/**'
            ai-plugins:
              - 'ai-plugins/**'
              - '.opencode/agent/**'
              - '.agents/**'
            workflows:
              - '.github/workflows/**'
              - 'lefthook.yml'
              - 'justfile'

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.registry == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            backend/go.sum
            registry/go.sum
      # golangci-lint v1.x: the .golangci.yml at repo root uses v1
      # schema. Pin to golangci-lint-action@v6 (last major that
      # supports golangci-lint v1). To move to golangci-lint v2,
      # bump the action to @v7+ and migrate .golangci.yml to v2.
      # golangci-lint v2.x: the .golangci.yml at repo root uses the
      # v2 schema (migrated from v1 because v1.62 was built with
      # go1.23 and cannot lint Go 1.25 modules). Pin to
      # golangci-lint-action@v7 (v2-capable) with version v2.12.2.
      # only-new-issues: true flags only issues in changed files —
      # matches the v1 config's "gate new breakage without
      # retroactively churning the codebase" intent. The codebase
      # has ~280 pre-existing findings (gofmt/goimports drift +
      # unused symbols) that v1 never surfaced because the config
      # failed to load; only-new-issues avoids a forced sweep.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: backend
          only-new-issues: true
          args: --timeout=5m
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: registry
          only-new-issues: true
          args: --timeout=5m

  frontend-lint:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx biome check

  frontend-build:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:pages
      - run: npm run build

  backend-unit:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      # Unit tests only — ./e2e/... needs the e2e build tag + a live
      # Postgres (see the backend-e2e job below).
      - run: go test -count=1 -timeout=120s ./internal/... ./cmd/...

  backend-e2e:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: okt
          POSTGRES_PASSWORD: okt_test
          POSTGRES_DB: okt
        ports:
          - 5433:5432
        # NOTE: do NOT mount the host workspace's docker-entrypoint-initdb.d
        # into this service container. The postgres entrypoint runs as root
        # and chowns the mountpoint; on the NEXT CI run actions/checkout@v4's
        # clean step fails with EACCES rmdir on that root-owned dir, breaking
        # every e2e run. Instead, the dedicated okt_tasks database is created
        # by the `Create okt_tasks database` step below (idempotent psql), so
        # no host-dir volume mount is needed. The health check gates the job
        # on pg_isready.
        options: >-
          --health-cmd "pg_isready -U okt -d okt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OKT_TEST_DATABASE_URL: postgres://okt:okt_test@localhost:5433/okt?sslmode=disable
      OKT_TEST_TASKS_DATABASE_URL: postgres://okt:okt_test@localhost:5433/okt_tasks?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      # Create the dedicated okt_tasks database the test harness expects
      # (replaces the docker-entrypoint-initdb.d volume mount that caused
      # the persistent EACCES checkout flake). Idempotent: SELECT 1 FROM
      # pg_database skips CREATE when the DB already exists.
      - run: |
          psql "postgres://okt:okt_test@localhost:5433/okt?sslmode=disable" -tAc \
            "SELECT 1 FROM pg_database WHERE datname='okt_tasks'" | grep -q 1 || \
          psql "postgres://okt:okt_test@localhost:5433/okt?sslmode=disable" -c \
            "CREATE DATABASE okt_tasks"
      # The e2e suite takes ~4min on a warm local runner (233s) but
      # CI's shared runner is slower + has no warm Go build cache.
      # With summarization + refinement enabled (more tests exercise
      # the full task chain), the suite grew beyond 600s on CI.
      # 900s (15min) gives headroom. Skip the SERPER_API_KEY-gated
      # test; add the secret to enable it.
      - run: go test -tags=e2e -count=1 -timeout=900s -skip TestSerperSearchProvider_Search ./e2e/...

  registry:
    needs: changes
    if: ${{ needs.changes.outputs.registry == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: registry/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 -timeout=120s ./...

  sqlc-diff:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      # sqlc isn't a Go module import; install the CLI matching the
      # version pinned in backend/sqlc.yaml (no version pin there
      # yet, so track the latest stable here — bump consciously).
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0
      - run: sqlc generate
      - name: Fail if generated store is stale
        run: git diff --exit-code -- internal/store/

  ai-plugins:
    needs: changes
    if: ${{ needs.changes.outputs.ai-plugins == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 20 ships `node --test` (the generator + manifest suites use it).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Bun runs the opencode plugin runtime tests (TS + isolated HOME).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      # python3 stdlib `tomllib` validates the generated Codex .toml files.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install plugin deps
        working-directory: ai-plugins
        run: bun install --frozen-lockfile
      # Mirror of `just test-plugins`: drift gate + manifest validation +
      # generator unit tests + opencode runtime tests + tsc typecheck.
      - name: Drift gate (sync --check)
        run: node ai-plugins/scripts/sync-agents.mjs --check
      - name: Generator + manifest tests
        run: node --test ai-plugins/scripts/sync-agents.test.mjs ai-plugins/scripts/validate-manifests.test.mjs
      - name: opencode plugin runtime tests
        working-directory: ai-plugins
        run: bun test opencode/index.test.ts
      - name: Typecheck
        working-directory: ai-plugins
        run: bunx tsc -p tsconfig.json